pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'ore-cutter'

// The mod is data only: the recipes live in pack/, and `fabric` and `neoforge` each wrap that
// folder in a jar their loader can read. The same folder, zipped, is the data pack.
include 'fabric', 'neoforge'
