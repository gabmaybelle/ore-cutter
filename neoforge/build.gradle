plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

// The mod has no code: the jar is pack/ (the recipes) plus neoforge.mods.toml.
sourceSets.main {
	resources.srcDir rootProject.file('pack')
}

// The game tests (src/gametest) are a mod of their own, loaded only by runGameTestServer below;
// nothing in them ships in the jar.
sourceSets {
	gametest
}

neoForge {
	version = project.neoforge_version
	addModdingDependenciesTo(sourceSets.gametest)

	mods {
		"orecutter" {
			sourceSet sourceSets.main
		}
		"orecutter_gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		client {
			client()
			loadedMods = [mods.orecutter]
		}
		server {
			server()
			programArgument '--nogui'
			loadedMods = [mods.orecutter]
		}
		// Server game tests: `./gradlew :neoforge:runGameTestServer` starts vanilla's test server
		// (a flat world, no window) and runs the checks in src/gametest: every recipe in pack/ is in
		// the game, and a stonecutter offers each ore its twin and nothing else. It exits non-zero
		// if one fails.
		//   -PextraMods=<folder>  also load every jar in that folder
		//   -PexpectMods=<ids>    comma-separated mod ids that must be loaded, so a run whose extra
		//                         jars didn't load fails instead of passing without them
		gameTestServer {
			type = 'gameTestServer'
			loadedMods = [mods.orecutter, mods.orecutter_gametest]
			programArguments.addAll('--tests', 'orecutter_gametest:*')
			systemProperty 'orecutter.expect', rootProject.file('pack').absolutePath
			systemProperty 'orecutter.expectMods', project.findProperty('expectMods') ?: ''
		}
	}
}

if (project.hasProperty('extraMods')) {
	dependencies {
		runtimeOnly fileTree(project.extraMods) { include '*.jar' }
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": version
	}
}

// ore-cutter-neoforge-<version>.jar, the name players download.
tasks.named('jar') { archiveBaseName = "${rootProject.name}-neoforge" }
